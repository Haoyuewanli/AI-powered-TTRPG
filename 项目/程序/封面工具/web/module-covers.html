<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模组封面 · 本地跑团</title>
  <link rel="stylesheet" href="/module-covers.css">
  <script type="module" src="/module-covers.mjs"></script>
</head>
<body class="module-covers-page">
  <main class="mc-shell">
    <header class="mc-header">
      <a class="mc-back" href="/">← 返回平台</a>
      <span class="mc-eyebrow">本机 DM · 素材管理</span>
      <button type="button" id="refresh-catalog">刷新目录</button>
    </header>
    <section class="mc-heading">
      <p class="mc-eyebrow">MODULE / COVERS</p>
      <h1>模组封面</h1>
      <p class="mc-intro">自动读取分类下的模组封面，裁切只改变显示，原图保持完整。</p>
    </section>
    <p id="tool-status" class="mc-status" role="status" aria-live="polite">正在读取模组目录…</p>
    <p id="tool-error" class="mc-error" role="alert" hidden></p>
    <section id="auth-required" class="mc-empty" hidden>
      <h2>请先以本机 DM 身份进入</h2>
      <p>此工具沿用平台的本机视角会话，不提供新的登录入口。</p>
      <a class="mc-primary-link" href="/">返回平台并选择 DM</a>
    </section>
    <section id="library-content" hidden>
      <nav id="module-groups" class="mc-groups" aria-label="模组分类"></nav>
      <section id="empty-library" class="mc-empty" hidden>
        <h2>目录中还没有模组</h2>
        <p>请按“分类 / 模组 / 模组封面.png 或 .jpg”放置文件，再刷新目录。</p>
      </section>
      <div id="module-track" class="mc-track" role="group" aria-label="模组封面，左右滑动或用方向键浏览"></div>
      <div id="module-navigation" class="mc-navigation">
        <button type="button" id="previous-module" aria-label="上一个模组">向左</button>
        <span id="module-position" aria-live="polite"></span>
        <button type="button" id="next-module" aria-label="下一个模组">向右</button>
      </div>
      <section id="module-detail" class="mc-detail" hidden>
        <div><h2 id="module-name"></h2><p id="module-description"></p><p id="module-issue" class="mc-error" hidden></p></div>
        <button type="button" id="open-crop" class="mc-primary" disabled>切割封面</button>
      </section>
      <details class="mc-location"><summary>本地目录与配置</summary><dl><dt>模组根目录</dt><dd id="module-root"></dd><dt>统一裁切配置</dt><dd id="config-file"></dd></dl></details>
    </section>
    <noscript>此工具需要浏览器 JavaScript。请使用本地跑团入口打开。</noscript>
  </main>

  <dialog id="crop-dialog" class="mc-dialog" aria-labelledby="crop-title">
    <header class="mc-dialog-header"><div><h2 id="crop-title">切割封面</h2><p id="crop-description"></p></div><button type="button" id="cancel-crop">取消</button></header>
    <div class="mc-editor">
      <div id="crop-stage" class="mc-source"><img id="crop-original" alt="完整封面原图"><div id="crop-outline" hidden></div></div>
      <div class="mc-controls">
        <label>显示方式<select id="crop-mode"><option value="contain">完整显示</option><option value="crop">裁切填满</option></select></label>
        <label><span>水平位置<output id="crop-x-value">50%</output></span><input id="crop-x" type="range" min="0" max="100" step="1" value="50"></label>
        <label><span>垂直位置<output id="crop-y-value">50%</output></span><input id="crop-y" type="range" min="0" max="100" step="1" value="50"></label>
        <label><span>放大<output id="crop-zoom-value">1.00×</output></span><input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
        <canvas id="crop-preview" width="300" height="400" aria-label="3比4封面显示预览"></canvas>
      </div>
    </div>
    <p id="crop-status" class="mc-status" role="status" aria-live="polite"></p>
    <p id="crop-error" class="mc-error" role="alert" hidden></p>
    <div class="mc-dialog-actions"><button type="button" id="review-crop" hidden>刷新并重新核对</button><span class="mc-grow"></span><button type="button" id="show-full-cover">完整原图</button><button type="button" id="save-crop" class="mc-primary">保存裁切</button></div>
  </dialog>
</body>
</html>
